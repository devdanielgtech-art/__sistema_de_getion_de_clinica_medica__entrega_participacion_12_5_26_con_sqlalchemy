{% extends 'base.html' %}

{% block title %}USUARIOS | EDIT{% endblock %}

{% block content %}

<h1>Actualizar Usuario</h1>

<form action="{{ url_for('usuario.edit', id=usuario.id) }}" method="POST">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" class="form-control" name="nombre" value="{{ usuario.nombre }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Usuario</label>
    <input type="text" class="form-control" name="username" value="{{ usuario.username }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" name="password" placeholder="Dejar en blanco para no cambiar">
  </div>
  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select name="rol" class="form-select" required>
      <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Admin</option>
      <option value="recepcionista" {% if usuario.rol == 'recepcionista' %}selected{% endif %}>Recepcionista</option>
      <option value="medico" {% if usuario.rol == 'medico' %}selected{% endif %}>Medico</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Actualizar Usuario</button>
</form>

{% endblock %}
