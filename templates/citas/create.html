{% extends 'base.html' %}

{% block title %}CITAS | CREATE{% endblock %}

{% block content %}

<h1>Registro de Cita</h1>

<form action="{{ url_for('cita.create') }}" method="POST">
  <div class="mb-3">
    <label class="form-label">Medico</label>
    <select name="medico_id" class="form-control" required>
      <option value="">Seleccione un Medico</option>
      {% for medico in medicos %}
        <option value="{{medico.id}}">{{medico.nombre}} - {{medico.especialidad}}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Paciente</label>
    <select name="paciente_id" class="form-control" required>
      <option value="">Seleccione un Paciente</option>
      {% for paciente in pacientes %}
        <option value="{{paciente.id}}">{{paciente.nombre}}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Fecha y Hora</label>
    <input type="datetime-local" class="form-control" name="fecha_hora" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Motivo</label>
    <textarea class="form-control" name="motivo" rows="3" required></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Estado</label>
    <select name="estado" class="form-control" required>
      <option value="pendiente">Pendiente</option>
      <option value="confirmada">Confirmada</option>
      <option value="cancelada">Cancelada</option>
      <option value="completada">Completada</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Registrar Cita</button>
</form>

{% endblock %}
